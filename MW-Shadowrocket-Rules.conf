#!name=MW地区分流
#!desc=按国家和服务分流，节点来自机场订阅

[Proxy Group]

# 机场分组：按 ff400.yaml 的分组名称使用；节点仍由机场订阅提供
Proxies = select,include-all-proxies=true
YouTube = select,Proxies,HK,JP,SG,TW,US
Disney = select,Proxies,HK,JP,SG,TW,US
Hbomax = select,Proxies,HK,JP,SG,TW,US
Netflix = select,Proxies,HK,JP,SG,TW,US
Bahamut = select,Proxies,HK,TW
Bilibili = select,DIRECT,HK,TW
Spotify = select,Proxies,DIRECT,HK,JP,SG,TW,US
Steam = select,Proxies,DIRECT,HK,JP,SG,TW,US
Telegram = select,Proxies,HK,JP,SG,TW,US
Google = select,Proxies,HK,JP,SG,TW,US
Microsoft = select,Proxies,DIRECT,HK,JP,SG,TW,US
OpenAI = select,Proxies,HK,JP,SG,TW,US
PayPal = select,Proxies,DIRECT,HK,JP,SG,TW,US
Apple = select,Proxies,DIRECT,HK,JP,SG,TW,US
Final = select,Proxies,DIRECT
HK = select,include-all-proxies=true,policy-regex-filter=香港|Hong Kong|HongKong|HK
JP = select,include-all-proxies=true,policy-regex-filter=日本|Japan|JP|东京|Tokyo|大阪|Osaka
SG = select,include-all-proxies=true,policy-regex-filter=新加坡|Singapore|SG
TW = select,include-all-proxies=true,policy-regex-filter=台湾|Taiwan|TW
US = select,include-all-proxies=true,policy-regex-filter=美国|United States|USA|US|纽约|New York|洛杉矶|Los Angeles|硅谷|San Jose

# 旧规则兼容名称：暂时保留，方便现有规则继续工作；后续可手动删除
日本 = select,JP
加拿大 = select,Proxies
英国 = select,Proxies
香港 = select,HK
韩国 = select,Proxies
德国 = select,Proxies
法国 = select,Proxies
新加坡 = select,SG
美国 = select,US
苹果服务 = select,Apple
哔哩哔哩 = select,Bilibili
国内直连 = select,DIRECT
国外穿墙 = select,Proxies,DIRECT

