#!name=MW地区分流
#!desc=按国家和服务分流，节点来自机场订阅

[Proxy Group]

# 国家节点组：根据机场节点名称自动筛选，启用后可在小火箭里手动选择具体节点
日本 = select,policy-regex-filter=日本|Japan|JP|东京|Tokyo|大阪|Osaka
加拿大 = select,policy-regex-filter=加拿大|Canada|CA|多伦多|Toronto|温哥华|Vancouver
英国 = select,policy-regex-filter=英国|UK|Britain|United Kingdom|伦敦|London
香港 = select,policy-regex-filter=香港|Hong Kong|HongKong|HK
韩国 = select,policy-regex-filter=韩国|Korea|KR|首尔|Seoul
德国 = select,policy-regex-filter=德国|Germany|DE|柏林|Berlin|法兰克福|Frankfurt
法国 = select,policy-regex-filter=法国|France|FR|巴黎|Paris
新加坡 = select,policy-regex-filter=新加坡|Singapore|SG

# 服务节点组：这些组也可以在小火箭里手动指定一个节点
苹果服务 = select,policy-regex-filter=日本|Japan|JP|香港|Hong Kong|HK|新加坡|Singapore|美国|USA|US
哔哩哔哩 = select,policy-regex-filter=香港|Hong Kong|HK|台湾|Taiwan|TW|日本|Japan|JP|新加坡|Singapore|SG
国内直连 = select,direct
国外穿墙 = select,proxy

[Rule]

# 日本
DOMAIN-SUFFIX,jp,日本
DOMAIN-SUFFIX,co.jp,日本
DOMAIN-SUFFIX,amazon.co.jp,日本
DOMAIN-SUFFIX,rakuten.co.jp,日本
DOMAIN-SUFFIX,nhk.or.jp,日本

